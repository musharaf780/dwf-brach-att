buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 35
        targetSdkVersion = 35
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

// react-native-vision-camera's native library (libVisionCamera.so) is built
// via its own CMakeLists.txt, which doesn't request 16 KB ELF page alignment
// the way React Native's own native builds do. Google Play rejects uploads
// containing any 4 KB-aligned .so on API 35+, so force the linker flag here.
project(':react-native-vision-camera') {
    afterEvaluate {
        android.defaultConfig.externalNativeBuild.cmake.arguments "-DCMAKE_SHARED_LINKER_FLAGS=-Wl,-z,max-page-size=16384"
    }
}
